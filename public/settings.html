<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshVeg - Admin Settings</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .admin-container {
            max-width: 600px;
            margin: 4rem auto;
            padding: 2rem;
        }

        .admin-card {
            background: white;
            padding: 2.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            text-align: center;
        }

        .btn-large {
            font-size: 1.2rem;
            padding: 1rem 2rem;
            margin-top: 1rem;
        }

        .hidden {
            display: none;
        }

        .back-link {
            display: block;
            margin-bottom: 1rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* Toggle Switch */
        .switch-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
            padding: 2rem;
            background: #ffffff;
            border: 2px solid var(--primary);
            border-radius: 12px;
        }

        .switch-row {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .switch-label {
            font-size: 1.1rem;
            font-weight: 600;
            margin-right: 1rem;
            color: var(--text-dark);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            -webkit-transition: .4s;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            -webkit-transition: .4s;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: #10b981;
        }

        input:focus+.slider {
            box-shadow: 0 0 1px #10b981;
        }

        input:checked+.slider:before {
            -webkit-transform: translateX(26px);
            -ms-transform: translateX(26px);
            transform: translateX(26px);
        }
    </style>
</head>

<body>
    <header>
        <div class="nav-container">
            <a href="/" class="logo">🌿 FreshVeg Admin</a>
            <a href="/" class="cart-btn"
                style="background: white; color: var(--primary); border: 1px solid var(--primary);">返回商店</a>
        </div>
    </header>

    <div class="admin-container">
        <!-- Login Section -->
        <div id="login-section" class="admin-card">
            <h2 class="section-title" style="margin-bottom: 1.5rem;">管理員登入</h2>
            <div class="form-group">
                <label class="form-label" style="text-align: left;">管理員密碼 Password</label>
                <input type="password" id="admin-password" class="form-input" placeholder="請輸入密碼...">
            </div>
            <button id="login-btn" class="checkout-btn">登入 Login</button>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard-section" class="admin-card hidden">
            <h2 class="section-title">管理面板</h2>
            <!-- Store Status Toggle -->
            <div class="switch-container">
                <div class="switch-row">
                    <span class="switch-label">接受訂單 (Store Open)</span>
                    <label class="switch">
                        <input type="checkbox" id="store-toggle" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <p id="status-text" style="font-size: 0.95rem; font-weight: 500; margin: 0;">
                    目前狀態: 開啟 (3天後自動重置)
                </p>
            </div>

            <button id="sync-btn" class="checkout-btn btn-large">
                📊 整理訂單 (Sync Stats)
            </button>
            <p style="margin-top: 1rem; font-size: 0.9rem; color: var(--text-light);">
                點擊此按鈕將計算所有訂單並更新統計表。
            </p>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast">
        <span id="toast-icon">✅</span>
        <span id="toast-message">Operation successful</span>
    </div>

    <script>
        const loginSection = document.getElementById('login-section');
        const dashboardSection = document.getElementById('dashboard-section');
        const passwordInput = document.getElementById('admin-password');
        const loginBtn = document.getElementById('login-btn');
        const syncBtn = document.getElementById('sync-btn');
        const storeToggle = document.getElementById('store-toggle');
        const statusText = document.getElementById('status-text');
        const toast = document.getElementById('toast');
        let currentPassword = '';

        // Show Toast
        function showToast(message, type = 'success') {
            const icon = type === 'success' ? '✅' : '❌';
            document.getElementById('toast-icon').innerText = icon;
            document.getElementById('toast-message').innerText = message;
            toast.className = `toast visible ${type}`;
            setTimeout(() => toast.classList.remove('visible'), 3000);
        }

        // Login Logic
        loginBtn.addEventListener('click', async () => {
            const password = passwordInput.value.trim();
            if (!password) {
                showToast('請輸入密碼', 'error');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerText = '驗證中 Verifying...';

            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await response.json();

                if (data.success) {
                    currentPassword = password;
                    loginSection.classList.add('hidden');
                    dashboardSection.classList.remove('hidden');

                    // Fetch initial status
                    await fetchStoreStatus();

                    showToast('已登入 Login Successful');
                } else {
                    showToast(data.message || 'Login Failed', 'error');
                }
            } catch (error) {
                console.error('Login error:', error);
                showToast('連線錯誤 Connection Error', 'error');
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerText = '登入 Login';
            }
        });

        // Sync Logic
        syncBtn.addEventListener('click', async () => {
            syncBtn.disabled = true;
            syncBtn.innerText = '⏳ 處理中...';

            try {
                const response = await fetch('/api/admin/sync-stats', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: currentPassword })
                });

                const data = await response.json();

                if (data.success) {
                    showToast('訂單整理完成');
                } else {
                    showToast(data.message || 'Error', 'error');
                    // If auth failed, go back to login
                    if (response.status === 401) {
                        loginSection.classList.remove('hidden');
                        dashboardSection.classList.add('hidden');
                        passwordInput.value = '';
                    }
                }
            } catch (err) {
                console.error(err);
                showToast('連線錯誤', 'error');
            } finally {
                syncBtn.disabled = false;
                syncBtn.innerText = '📊 整理訂單 (Sync Stats)';
            }
        });
        // Store Status Logic
        async function fetchStoreStatus() {
            try {
                const res = await fetch('/api/store-status');
                const data = await res.json();
                updateToggleUI(data.isOpen);
            } catch (error) {
                console.error('Failed to fetch status');
            }
        }

        function updateToggleUI(isOpen) {
            storeToggle.checked = isOpen;
            statusText.textContent = isOpen
                ? '目前狀態: 開啟 (接單中)'
                : '目前狀態: 關閉 (本周訂單已截止)';
            statusText.style.color = isOpen ? '#10b981' : '#e63946';
        }

        storeToggle.addEventListener('change', async (e) => {
            const isOpen = e.target.checked;

            // Optimistic update
            updateToggleUI(isOpen);

            try {
                const response = await fetch('/api/admin/store-status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: currentPassword, isOpen })
                });

                const data = await response.json();
                if (data.success) {
                    showToast(data.message);
                } else {
                    showToast(data.message, 'error');
                    // Revert if failed
                    updateToggleUI(!isOpen);
                }
            } catch (error) {
                console.error(error);
                showToast('連線錯誤', 'error');
                updateToggleUI(!isOpen);
            }
        });
    </script>
</body>

</html>
