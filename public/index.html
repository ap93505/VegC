<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshVeg - 有機蔬菜訂購</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="sticky-top-container">
        <div id="announcement-bar" class="announcement-bar"></div>
        <header>
            <div class="nav-container">
                <a href="#" class="logo">🌿 FreshVeg</a>
                <div style="display: flex; gap: 1rem;">
                    <button class="cart-btn" id="ordersToggle" style="background: var(--text-light);">
                        <span>📋 訂單列表</span>
                    </button>
                    <button class="cart-btn" id="cartToggle">
                        <span>🛒 購物車</span>
                        <span id="cartCount">0</span>
                    </button>
                </div>
            </div>
        </header>
    </div>

    <div class="hero">
        <div>
            <h1>Eva幫爸爸賣菜</h1>
            <p>冬天產量過剩，Eva又要來開團啦，歡迎大家購買</p>
            <p id="visit-count" style="font-size: 0.9rem; margin-top: 0.5rem; color: rgba(255, 255, 255, 0.5);">今日造訪人次:
                載入中...</p>
        </div>
    </div>

    <main class="container">
        <h2 class="section-title">本週精選</h2>
        <div id="productGrid" class="products-grid">
            <!-- Products will be injected here JS -->
            <div class="loading" style="grid-column: 1/-1; text-align: center; padding: 2rem;">
                載入中...
            </div>
        </div>
    </main>

    <!-- Orders List Modal -->
    <div class="modal-overlay" id="ordersModal">
        <div class="modal" style="max-width: 600px;">
            <div class="modal-header">
                <h3>本週訂單列表</h3>
                <button class="close-btn" id="closeOrdersModal">&times;</button>
            </div>

            <div id="ordersList" style="max-height: 60vh; overflow-y: auto;">
                <p style="text-align: center; color: #888;">載入中...</p>
            </div>
        </div>
    </div>

    <!-- Cart Modal -->
    <div class="modal-overlay" id="cartModal">
        <div class="modal">
            <div class="modal-header">
                <h3>您的購物籃</h3>
                <button class="close-btn" id="closeModal">&times;</button>
            </div>

            <div class="cart-items" id="cartItems">
                <!-- Cart items injected here -->
                <p style="text-align: center; color: #888;">購物車是空的</p>
            </div>

            <div class="cart-total">
                總計: $<span id="cartTotal">0</span>
            </div>

            <form id="orderForm">
                <div class="form-group">
                    <label class="form-label" for="name">姓名</label>
                    <input type="text" id="name" class="form-input" required placeholder="請輸入您的大名">
                </div>
                <div class="form-group">
                    <label class="form-label" for="pickupLocation">取貨地點</label>
                    <select id="pickupLocation" class="form-input" required>
                        <option value="" disabled selected>請選擇取貨地點</option>
                        <option value="A棟25F">A棟25F</option>
                        <option value="D棟17F">D棟17F</option>
                    </select>
                </div>

                <button type="submit" class="checkout-btn" disabled id="checkoutBtn">立即下單</button>
            </form>
        </div>
    </div>

    <!-- Order Closed Modal -->
    <div class="modal-overlay" id="closedModal" style="z-index: 3000;">
        <div class="modal" style="max-width: 400px;">
            <div class="closed-modal-content">
                <h3>目前商店已關閉</h3>
                <p>如需下單請聯繫 Eva</p>
                <button id="closeClosedModalBtn">我知道了</button>
            </div>
        </div>
    </div>

    <!-- User Details Modal -->
    <div class="modal-overlay" id="userDetailsModal" style="z-index: 2500;">
        <div class="modal" style="max-width: 500px;">
            <div class="modal-header">
                <h3>訂單明細</h3>
                <button class="close-btn" id="closeUserDetailsModal">&times;</button>
            </div>
            <div id="userDetailsContent">
                <!-- JS injected content -->
            </div>
            <div style="margin-top: 1.5rem; text-align: right;">
                <button class="checkout-btn" style="background: var(--text-light);"
                    onclick="document.getElementById('userDetailsModal').classList.remove('active')">關閉</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <span id="toastMessage">操作成功</span>
    </div>

    <a href="settings.html" class="settings-link">⚙️</a>
    <script src="script.js?v=3"></script>
</body>

</html>
